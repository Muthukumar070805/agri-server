[project]
name = "agri-server"
version = "0.1.0"
description = "AI voice/text assistant for farmer helpline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sarvamai>=0.1.27",
    "fastapi>=0.135.3",
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24.0",
    "uvicorn>=0.44.0",
    "pydantic-settings>=2.0.0",
    "websockets>=12.0",
    "numpy>=1.26.0",
    "python-multipart>=0.0.9",
    "redis>=5.0.0",
    "langchain>=0.3.0",
    "langgraph>=0.2.0",
    "langchain-huggingface>=0.1.0",
    "langchain-pinecone>=0.2.0",
    "langchain-ollama>=0.1.0",
    "langchain-mistralai>=0.1.0",
    "sentence-transformers>=3.0.0",
    "requests>=2.31.0",
    "pipecat-ai>=0.0.108",
    "python-socketio[asyncio]>=5.11.0",
    "nest-asyncio>=1.6.0",
    "earthengine-api>=1.2.0",
]

[project.optional-dependencies]
audio = [
    "pyaudio>=0.2.14",
]

[dependency-groups]
dev = [
    "hypothesis>=6.100.0",
    "pre-commit>=4.7.0",
    "pytest-timeout>=2.3.0",
    "ruff==0.17.3",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "B",    # bugbear
    "BLE",  # blind-except
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "PIE",  # flake8-pie
    "RUF",  # ruff-specific
    "S",    # bandit
    "SIM",  # flake8-simplify
    "UP",   # pyupgrade
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # asserts are the point of tests

[tool.setuptools]
packages = ["app"]
